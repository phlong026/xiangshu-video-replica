[package]
name = "video-replica-desktop"
version = "0.1.0"
description = "Internal video replica desktop app"
authors = ["Internal AI Team"]
edition = "2021"

[lib]
name = "video_replica_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["local-sidecar"]
# DESK-02 (T29): the internal build keeps auto-starting the bundled local
# FastAPI sidecar exactly as before. A customer-cloud build compiles with
# `--no-default-features` so the shipped app can never silently boot a local
# business source of truth behind the customer's back.
local-sidecar = []
# DESK-01 (T29): add dpapi for secure credential vault on Windows
dpapi = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# serde / serde_json / uuid are already resolved in the locked tree by the
# Tauri dependency graph itself (Cargo.lock pins uuid 1.24) 鈥?declaring them
# here adds no new external code to the audit surface, it only re-uses what
# is locked (搂10.2 dependency-review posture for the credential vault).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.24", features = ["v4"] }
# DEK-01 (T29): Windows Data Protection API for secure credential storage
[target.'cfg(windows)'.dependencies]
dpapi = { version = "0.3", optional = true }
windows-sys = { version = "0.59", features = [
    "Win32_Security_CredentialManager",
    "Win32_Security",
], optional = true }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

