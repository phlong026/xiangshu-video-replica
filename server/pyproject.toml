[project]
name = "video-replica-api"
version = "0.1.0"
description = "Internal API service for the video replica desktop app"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.17.2",
    "cos-python-sdk-v5>=1.9.44",
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "oss2>=2.19.1",
    "uvicorn==0.52.2",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"
