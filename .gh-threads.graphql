query {
  repository(owner: "phlong026", name: "xiangshu-video-replica") {
    pullRequest(number: 49) {
      reviewThreads(first: 50) {
        nodes {
          id
          isResolved
          comments(first: 5) {
            nodes {
              databaseId
              body
              author { login }
            }
          }
        }
      }
    }
  }
}
