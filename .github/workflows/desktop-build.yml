name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Customer HTTPS API origin
        type: string
        required: true
        default: https://video.zszhj.cn
  push:
    # 首个可评审构建已由 2026-09 的任务分支完成并合入 main，过期分支监听
    # 已清理（本地与远端均无该分支，2026-10-31 冗余清理核查确认）。
    branches: [main]
    # v* 标签构建三平台内部未签名预览；全部成功后才允许挂到预发布 Release
    # （标签推送不适用 paths 过滤，保证发版不受改动路径影响）。
    tags: ['v*']
    paths:
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.cargo/**'
      - '.github/workflows/desktop-build.yml'
      - 'scripts/release/**'
      - 'scripts/ffmpeg-minimal/**'
      - 'scripts/require_customer_api_base.mjs'

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg-windows-binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # 复用受审阅的 LGPL 构建，不能依赖本轮尚未创建的 Release。
      - run: bash scripts/ffmpeg-minimal/build.sh "$RUNNER_TEMP/ffmpeg-out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ffmpeg-windows-lgpl
          path: ${{ runner.temp }}/ffmpeg-out/*.exe
          if-no-files-found: error
          retention-days: 1

  build:
    needs: ffmpeg-windows-binaries
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            bundle_dir: nsis
            config: src-tauri/tauri.customer.conf.json
            binary_arch: x86_64
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app
            bundle_dir: dmg
            config: src-tauri/tauri.macos.conf.json
            binary_arch: arm64
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
            bundle_dir: dmg
            config: src-tauri/tauri.macos.conf.json
            binary_arch: x86_64
    defaults:
      run:
        shell: bash
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url || 'https://video.zszhj.cn' }}
      RUST_TARGET: ${{ matrix.target }}
      BUNDLE_CONFIG: ${{ matrix.config }}
      BUNDLE_TYPES: ${{ matrix.bundles }}
      BUNDLE_DIR: ${{ matrix.bundle_dir }}
      BINARY_ARCH: ${{ matrix.binary_arch }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate customer API origin
        run: npm run require:customer-api-base
      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --target "$RUST_TARGET"
          rustup default stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Scan source for secrets
        run: npm run check:security
      - name: Download verified build inputs
        if: runner.os == 'Windows'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ffmpeg-windows-lgpl
          path: client/src-tauri/resources/ffmpeg
      - name: Build desktop installer
        run: |
          sign_args=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sign_args=(--no-sign)
          fi
          npm run tauri --workspace client -- build \
            --config "$BUNDLE_CONFIG" --bundles "$BUNDLE_TYPES" \
            --target "$RUST_TARGET" --ci "${sign_args[@]}" \
            -- --locked --no-default-features
      - name: Create macOS disk image
        if: runner.os == 'macOS'
        run: |
          apps=(".cargo-target/$RUST_TARGET/release/bundle/macos/"*.app)
          [[ ${#apps[@]} -eq 1 && -d "${apps[0]}" ]]
          stage=$(mktemp -d "$RUNNER_TEMP/desktop-dmg.XXXXXX")
          ditto "${apps[0]}" "$stage/$(basename "${apps[0]}")"
          ln -s /Applications "$stage/Applications"
          version=$(node -p 'require("./package.json").version')
          output=".cargo-target/$RUST_TARGET/release/bundle/dmg"
          mkdir -p "$output"
          # Native image creation does not need a Finder automation session.
          hdiutil create -volname "众墅之家 AI 爆款视频工具 $version" -srcfolder "$stage" \
            -format UDZO "$output/VideoReplica_${version}_${PLATFORM}.dmg"
      - name: Create macOS updater archive
        if: runner.os == 'macOS'
        run: |
          # Tauri updater 在 macOS 上解包 .app.tar.gz 原地替换；归档根即 .app 本身。
          apps=(".cargo-target/$RUST_TARGET/release/bundle/macos/"*.app)
          version=$(node -p 'require("./package.json").version')
          output=".cargo-target/$RUST_TARGET/release/bundle/dmg"
          tar --gzip -cf "$output/VideoReplica_${version}_${PLATFORM}.app.tar.gz" \
            -C ".cargo-target/$RUST_TARGET/release/bundle/macos" "$(basename "${apps[0]}")"
      - name: Verify macOS application and disk image
        if: runner.os == 'macOS'
        run: |
          apps=(".cargo-target/$RUST_TARGET/release/bundle/macos/"*.app)
          images=(".cargo-target/$RUST_TARGET/release/bundle/dmg/"*.dmg)
          [[ ${#apps[@]} -eq 1 && -d "${apps[0]}" ]]
          [[ ${#images[@]} -eq 1 && -f "${images[0]}" ]]
          codesign --verify --deep --strict "${apps[0]}"
          lipo "${apps[0]}/Contents/MacOS/video-replica-desktop" -verify_arch "$BINARY_ARCH"
          hdiutil verify "${images[0]}"
      - name: Collect installer and provenance
        run: |
          node scripts/release/collect-desktop-artifacts.mjs "$PLATFORM" \
            ".cargo-target/$RUST_TARGET/release/bundle/$BUNDLE_DIR" \
            "output/desktop/$PLATFORM"
          # Keep provenance beside the installer; never upload the whole workspace.
          test -f "output/desktop/$PLATFORM/manifest.json"
          test -f "output/desktop/$PLATFORM/SHA256SUMS.txt"
          test -f "output/desktop/$PLATFORM/RELEASE-CHANNEL.txt"
      - name: Archive platform installer and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-${{ matrix.platform }}
          path: output/desktop/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: desktop-*
          path: output/downloaded
          merge-multiple: false
      - name: Validate all provenance and package distinct platform assets
        run: python3 scripts/release/prepare-desktop-release.py output/downloaded output/release
      # gh release create 仅在明确不存在时执行；已有同名资产须逐字节一致。
      # 这里只发布内部未签名预览包，不生成生产 stable 清单。
      - name: Publish internal preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/publish-desktop-release.py output/release
