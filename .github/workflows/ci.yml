name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Scan runtime contract surface
        run: npm run check:security

  quality-linux:
    name: Linux quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # M0 review H2: run the PostgreSQL tests in CI instead of silently
      # skipping them. Port/host/credentials mirror scripts/pg-fixture.sh so
      # TEST_POSTGRESQL_URL stays identical locally and in CI.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: customer_v3_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d customer_v3_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRESQL_URL: postgresql://testuser:testpass@localhost:5433/customer_v3_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        run: |
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Python dependencies
        run: uv sync --project server --locked --group dev --python 3.12
      - name: Run repository quality checks
        run: npm run check
      - name: Run Rust tests
        run: cargo test --manifest-path client/src-tauri/Cargo.toml --locked
      - name: Build web client
        run: npm run build
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

  windows-nsis:
    name: Windows Tauri and NSIS
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check Tauri project
        run: npm run check:tauri
      - name: Build unsigned NSIS installer
        run: npm run tauri:build -- --bundles nsis --no-sign --ci
      - name: Record installer SHA256
        shell: pwsh
        run: Get-FileHash .cargo-target/release/bundle/nsis/*.exe -Algorithm SHA256
      - name: Upload unsigned NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-nsis-${{ github.sha }}
          path: .cargo-target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  t07-final-review-red-green:
    name: T07 final snapshot red-green review
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/customer-v3-t07-sqlite-postgres-import'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: customer_v3_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d customer_v3_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRESQL_URL: postgresql://testuser:testpass@localhost:5433/customer_v3_test
    steps:
      - name: Checkout task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/customer-v3-t07-sqlite-postgres-import
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: false
      - name: Install locked server dependencies
        run: uv sync --project server --locked --group dev --python 3.12
      - name: Execute red tests, implementation and PostgreSQL 16 regression
        run: uv --cache-dir .uv-cache run --project server --locked python server/scripts/t07_review_autofix.py
      - name: Commit final review fixes and restore standard CI
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm server/scripts/t07_review_autofix.py
          git add \
            .github/workflows/ci.yml \
            docs/evidence/T07-EVIDENCE.md \
            server/app/backup.py \
            server/scripts/reconcile_customer_billing.py \
            server/scripts/sqlite_to_postgres.py \
            server/tests/test_sqlite_to_postgres.py
          git diff --cached --check
          git commit -m "fix: make T07 snapshot publication atomic"
          git push origin HEAD:feat/customer-v3-t07-sqlite-postgres-import
