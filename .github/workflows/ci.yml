name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Scan runtime contract surface
        run: npm run check:security

  quality-linux:
    name: Linux quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # M0 review H2: run the PostgreSQL tests in CI instead of silently
      # skipping them. Port/host/credentials mirror scripts/pg-fixture.sh so
      # TEST_POSTGRESQL_URL stays identical locally and in CI.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: customer_v3_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d customer_v3_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRESQL_URL: postgresql://testuser:testpass@localhost:5433/customer_v3_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        run: |
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Python dependencies
        run: uv sync --project server --locked --group dev --python 3.12
      - name: Run repository quality checks
        run: npm run check
      - name: Run Rust tests
        run: cargo test --manifest-path client/src-tauri/Cargo.toml --locked
      - name: Build web client
        run: npm run build
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

  windows-nsis:
    name: Windows Tauri and NSIS
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check Tauri project
        run: npm run check:tauri
      - name: Build unsigned NSIS installer
        run: npm run tauri:build -- --bundles nsis --no-sign --ci
      - name: Record installer SHA256
        shell: pwsh
        run: Get-FileHash .cargo-target/release/bundle/nsis/*.exe -Algorithm SHA256
      - name: Upload unsigned NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-nsis-${{ github.sha }}
          path: .cargo-target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  t07-finalize-ledger:
    name: T07 finalize verified ledger
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 38 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/customer-v3-t07-sqlite-postgres-import'
    needs: [secret-scan, quality-linux, windows-nsis]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Fetch the verified T07 head without another checkout action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          T07_BRANCH: ${{ github.event.pull_request.head.ref }}
          T07_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --depth=1 origin "${T07_BRANCH}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${T07_HEAD_SHA}"
      - name: Apply verified T07 ledger closure
        env:
          T07_LEDGER_RUN_NUMBER: ${{ github.run_number }}
          T07_IMPLEMENTATION_SHA: c26bc0732d9fe66142dae3c50ac9c908bdf578a8
        run: python .github/t07_finalize_ledger.py
      - name: Commit verified T07 evidence and remove temporary automation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          T07_BRANCH: ${{ github.event.pull_request.head.ref }}
          T07_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          expected_docs=$(printf '%s\n' \
            'docs/CUSTOMER-TASK-EVIDENCE-V3.md' \
            'docs/evidence/T07-EVIDENCE.md' \
            'docs/客户版任务清单-V3.md' | sort)
          actual_docs=$(git diff --name-only | sort)
          test "${actual_docs}" = "${expected_docs}"

          auth=$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/t07_finalize_ledger.py

          expected_final=$(printf '%s\n' \
            '.github/t07_finalize_ledger.py' \
            '.github/workflows/ci.yml' \
            'docs/CUSTOMER-TASK-EVIDENCE-V3.md' \
            'docs/evidence/T07-EVIDENCE.md' \
            'docs/客户版任务清单-V3.md' | sort)
          actual_final=$(git diff --name-only | sort)
          test "${actual_final}" = "${expected_final}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            docs/CUSTOMER-TASK-EVIDENCE-V3.md \
            docs/evidence/T07-EVIDENCE.md \
            docs/客户版任务清单-V3.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "T07 ledger finalizer produced no staged changes" >&2
            exit 1
          fi
          git commit -m "docs: close T07 verified evidence ledger"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            push origin HEAD:"refs/heads/${T07_BRANCH}" \
            --force-with-lease="refs/heads/${T07_BRANCH}:${T07_HEAD_SHA}"
