name: Annual license schema probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  measure:
    if: github.event.pull_request.number == 210 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TEST_POSTGRESQL_URL: postgresql://testuser:testpass@127.0.0.1:5433/customer_v3_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: customer_v3_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - "5433:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Apply the migrations
        working-directory: server
        run: VIDEO_REPLICA_DATABASE_URL="$TEST_POSTGRESQL_URL" uv run --locked python -m alembic upgrade head
      - name: Measure the PostgreSQL schema
        run: uv run --project server --locked python scripts/ci/migration_manifest.py --print-schema
